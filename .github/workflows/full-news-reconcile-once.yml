name: One-off full Zine sitemap reconciliation

on:
  push:
    paths:
      - '.github/workflows/full-news-reconcile-once.yml'

permissions:
  contents: write

concurrency:
  group: sitemap-full-news-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Regenerate and validate full sitemap inventory
        run: python scripts/generate_sitemap.py --full

      - name: Commit reconciled output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.xml sitemap.xml index.html www zine data
          if git diff --cached --quiet; then
            echo 'Sitemaps already up to date'
            exit 0
          fi
          git commit -m 'Reconcile Zine sitemap after News archive replacement'
          git pull --rebase origin main
          git push origin HEAD:main
