name: Generate Trevorion Sitemaps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # every day at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Generate and validate sitemaps
        run: python scripts/generate_sitemap.py

      - name: Commit changed sitemaps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.xml index.html www/webpage.xml zine/home.xml zine/profile.xml zine/explore.xml zine/news.xml zine/articles.xml zine/archive.xml zine/comics.xml zine/shop.xml zine/about.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes"
            exit 0
          fi
          git commit -m "Update Trevorion sitemaps"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
