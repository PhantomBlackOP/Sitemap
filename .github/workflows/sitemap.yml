name: Generate Trevorion Sitemaps

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Force a full reconciliation rebuild'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 1-6'  # incremental: Monday-Saturday at 03:00 UTC
    - cron: '0 3 * * 0'    # full reconciliation: Sunday at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Generate and validate sitemaps
        shell: bash
        run: |
          if [[ "${{ github.event.schedule }}" == "0 3 * * 0" || "${{ inputs.full_rebuild }}" == "true" ]]; then
            python scripts/generate_sitemap.py --full
          else
            python scripts/generate_sitemap.py
          fi

      - name: Commit changed sitemaps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.xml index.html www zine data
          if git diff --cached --quiet; then
            echo "No sitemap changes"
            exit 0
          fi
          git commit -m "Update Trevorion sitemaps"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
